<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskPulse - 跨裝置同步待辦事項</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card-hover {
            transition: all 0.2s ease-in-out;
        }
        .glass-card-hover:hover {
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 8px 25px -5px rgba(0, 0, 0, 0.3), 0 0 15px 0 rgba(59, 130, 246, 0.1);
        }
    </style>
</head>
<body class="min-h-screen pb-12 flex flex-col antialiased">
    <!-- Header -->
    <header class="sticky top-0 z-30 glass-card border-b border-slate-800/80 bg-slate-900/80 backdrop-blur-md">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <!-- Logo -->
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/20">
                    <i class="fa-solid fa-check-double text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">TaskPulse</h1>
                    <p class="text-xs text-slate-400 font-medium">雲端實時同步待辦清單</p>
                </div>
            </div>

            <!-- Sync Controls & Status -->
            <div class="flex items-center space-x-2 sm:space-x-4">
                <div id="sync-status-badge" class="flex items-center space-x-2 px-3 py-1.5 rounded-full bg-slate-800/90 border border-slate-700/60 text-xs font-medium text-slate-300">
                    <span id="sync-dot" class="w-2.5 h-2.5 rounded-full bg-yellow-500 animate-pulse"></span>
                    <span id="sync-text">連接中...</span>
                </div>

                <button id="open-passcode-btn" class="flex items-center space-x-2 px-3 py-1.5 rounded-lg bg-blue-600/20 hover:bg-blue-600/30 text-blue-400 border border-blue-500/30 text-xs font-medium transition-all">
                    <i class="fa-solid fa-key"></i>
                    <span id="passcode-display-btn">通行碼: 未設定</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 pt-6">
        <!-- Passcode Sync Banner -->
        <div id="passcode-banner" class="mb-6 p-4 rounded-xl glass-card bg-gradient-to-r from-blue-900/20 via-indigo-900/20 to-slate-900 border border-blue-500/20 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div class="flex items-start space-x-3">
                <div class="p-2.5 bg-blue-500/10 rounded-lg border border-blue-500/20 text-blue-400 shrink-0">
                    <i class="fa-solid fa-arrows-rotate text-lg"></i>
                </div>
                <div>
                    <h3 class="text-sm font-semibold text-slate-200 flex items-center gap-2">
                        <span>跨裝置即時同步</span>
                        <span id="active-passcode-tag" class="px-2 py-0.5 rounded text-xs bg-blue-500/20 text-blue-300 border border-blue-500/30 font-mono">未設定</span>
                    </h3>
                    <p class="text-xs text-slate-400 mt-0.5">只要在任何手機或電腦輸入相同的通行碼（Passcode），即可雙向實時同步所有資料。</p>
                </div>
            </div>
            <div class="flex items-center space-x-2 w-full sm:w-auto justify-end">
                <button id="copy-passcode-btn" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium border border-slate-700 transition flex items-center gap-1.5">
                    <i class="fa-regular fa-copy"></i>
                    <span>複製通行碼</span>
                </button>
                <button id="change-passcode-btn" class="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium transition">
                    變更通行碼
                </button>
            </div>
        </div>

        <!-- Progress Summary Cards -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="p-4 rounded-xl glass-card">
                <div class="text-xs font-medium text-slate-400 flex items-center justify-between">
                    <span>總任務數</span>
                    <i class="fa-solid fa-list-check text-slate-500"></i>
                </div>
                <div class="text-2xl font-bold text-slate-100 mt-2" id="stat-total">0</div>
            </div>
            <div class="p-4 rounded-xl glass-card">
                <div class="text-xs font-medium text-slate-400 flex items-center justify-between">
                    <span>未完成</span>
                    <i class="fa-regular fa-circle text-amber-500"></i>
                </div>
                <div class="text-2xl font-bold text-amber-400 mt-2" id="stat-active">0</div>
            </div>
            <div class="p-4 rounded-xl glass-card">
                <div class="text-xs font-medium text-slate-400 flex items-center justify-between">
                    <span>已完成</span>
                    <i class="fa-regular fa-circle-check text-emerald-500"></i>
                </div>
                <div class="text-2xl font-bold text-emerald-400 mt-2" id="stat-completed">0</div>
            </div>
            <div class="p-4 rounded-xl glass-card flex flex-col justify-between">
                <div class="text-xs font-medium text-slate-400 flex items-center justify-between">
                    <span>完成進度</span>
                    <span id="stat-rate-text" class="text-blue-400 font-bold">0%</span>
                </div>
                <div class="w-full bg-slate-800 rounded-full h-2.5 mt-3 overflow-hidden">
                    <div id="stat-progress-bar" class="bg-gradient-to-r from-blue-500 to-emerald-400 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Controls & Quick Add Bar -->
        <div class="glass-card p-4 rounded-xl mb-6 space-y-4">
            <div class="flex flex-col md:flex-row gap-3 items-center justify-between">
                <!-- Search input -->
                <div class="relative w-full md:w-72">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="search-input" placeholder="搜尋待辦事項..." class="w-full bg-slate-800/90 border border-slate-700/80 rounded-lg pl-9 pr-4 py-2 text-sm text-slate-200 placeholder-slate-400 focus:outline-none focus:border-blue-500 transition">
                </div>

                <!-- Action Button -->
                <button id="add-task-btn" class="w-full md:w-auto px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm flex items-center justify-center gap-2 shadow-lg shadow-blue-600/20 transition">
                    <i class="fa-solid fa-plus"></i>
                    <span>新增待辦事項</span>
                </button>
            </div>

            <!-- Filters & Sorting -->
            <div class="flex flex-wrap items-center justify-between gap-3 pt-3 border-t border-slate-800 text-xs">
                <!-- Status tabs -->
                <div class="flex items-center space-x-1 bg-slate-800/80 p-1 rounded-lg border border-slate-700/60">
                    <button class="filter-tab-btn active px-3 py-1.5 rounded-md font-medium text-slate-300 hover:text-white transition" data-status="all">全部</button>
                    <button class="filter-tab-btn px-3 py-1.5 rounded-md font-medium text-slate-400 hover:text-white transition" data-status="active">進行中</button>
                    <button class="filter-tab-btn px-3 py-1.5 rounded-md font-medium text-slate-400 hover:text-white transition" data-status="completed">已完成</button>
                </div>

                <div class="flex flex-wrap items-center gap-2">
                    <!-- Category filter dropdown -->
                    <select id="category-filter" class="bg-slate-800 border border-slate-700 text-slate-300 rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-blue-500">
                        <option value="all">所有分類</option>
                        <option value="工作">工作</option>
                        <option value="個人">個人</option>
                        <option value="學習">學習</option>
                        <option value="健康">健康</option>
                        <option value="財務">財務</option>
                    </select>

                    <!-- Priority filter dropdown -->
                    <select id="priority-filter" class="bg-slate-800 border border-slate-700 text-slate-300 rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-blue-500">
                        <option value="all">所有優先級</option>
                        <option value="high">高優先級</option>
                        <option value="medium">中優先級</option>
                        <option value="low">低優先級</option>
                    </select>

                    <!-- Sort option -->
                    <select id="sort-by" class="bg-slate-800 border border-slate-700 text-slate-300 rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-blue-500">
                        <option value="createdAt-desc">建立時間 (新到舊)</option>
                        <option value="dueDate-asc">到期時間 (近到遠)</option>
                        <option value="priority-desc">優先級 (高到低)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Task List Container -->
        <div id="task-list" class="space-y-3">
            <!-- Dynamic task items injected here -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden glass-card rounded-xl p-12 text-center my-8">
            <div class="w-16 h-16 rounded-full bg-slate-800 text-slate-500 flex items-center justify-center mx-auto mb-4 border border-slate-700">
                <i class="fa-solid fa-clipboard-check text-2xl"></i>
            </div>
            <h3 class="text-base font-semibold text-slate-300">目前沒有符合條件的待辦事項</h3>
            <p class="text-xs text-slate-500 mt-1">點擊上方「新增待辦事項」按鈕開始記錄你的工作與生活目標吧！</p>
        </div>
    </main>

    <!-- Task Form Modal -->
    <div id="task-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm hidden">
        <div class="glass-card w-full max-w-lg rounded-2xl p-6 border border-slate-700 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between pb-4 border-b border-slate-800">
                <h3 id="modal-title" class="text-lg font-bold text-slate-100">新增待辦事項</h3>
                <button id="close-modal-btn" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="task-form" class="space-y-4 mt-4">
                <input type="hidden" id="task-id">

                <!-- Title -->
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">任務標題 *</label>
                    <input type="text" id="form-title" required placeholder="例如：準備週一產品會議報告" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500">
                </div>

                <!-- Description / Notes -->
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">詳細說明 / 備註</label>
                    <textarea id="form-notes" rows="3" placeholder="補充細節或補充連結..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 resize-none"></textarea>
                </div>

                <!-- Category & Priority Row -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">分類</label>
                        <select id="form-category" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                            <option value="工作">工作</option>
                            <option value="個人">個人</option>
                            <option value="學習">學習</option>
                            <option value="健康">健康</option>
                            <option value="財務">財務</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">優先級</label>
                        <select id="form-priority" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                            <option value="low">🟢 低 (Low)</option>
                            <option value="medium" selected>🟡 中 (Medium)</option>
                            <option value="high">🔴 高 (High)</option>
                        </select>
                    </div>
                </div>

                <!-- Due Date -->
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">到期時間</label>
                    <input type="datetime-local" id="form-due-date" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                </div>

                <!-- Subtasks Checklist -->
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label class="block text-xs font-medium text-slate-300">子任務 (Checklist)</label>
                        <button type="button" id="add-subtask-input-btn" class="text-xs text-blue-400 hover:text-blue-300 flex items-center gap-1">
                            <i class="fa-solid fa-plus text-xs"></i> 增加子項目
                        </button>
                    </div>
                    <div id="subtask-inputs-container" class="space-y-2 max-h-36 overflow-y-auto pr-1">
                        <!-- Subtask inputs dynamically injected -->
                    </div>
                </div>

                <!-- Modal Actions -->
                <div class="flex items-center justify-end space-x-3 pt-4 border-t border-slate-800">
                    <button type="button" id="cancel-task-btn" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium transition">取消</button>
                    <button type="submit" class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium transition shadow-lg shadow-blue-600/20">儲存任務</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Passcode Config Modal -->
    <div id="passcode-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm hidden">
        <div class="glass-card w-full max-w-md rounded-2xl p-6 border border-slate-700 shadow-2xl relative">
            <div class="flex items-center justify-between pb-4 border-b border-slate-800">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-key text-blue-400"></i>
                    <h3 class="text-lg font-bold text-slate-100">設定 Passcode Sync 通行碼</h3>
                </div>
                <button id="close-passcode-modal-btn" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="mt-4 space-y-4">
                <p class="text-xs text-slate-400 leading-relaxed">
                    輸入任何自訂的通行碼（例如：<code class="text-blue-300 bg-slate-800 px-1 py-0.5 rounded">my-todo-2026</code>），相同的通行碼將存取同一個雲端待辦清單。無需註冊帳號即可跨裝置同步！
                </p>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">同步通行碼</label>
                    <div class="relative">
                        <input type="text" id="passcode-input" placeholder="請輸入 4 位數以上的通行碼..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-slate-100 font-mono tracking-wider focus:outline-none focus:border-blue-500 pr-24">
                        <button type="button" id="generate-random-passcode-btn" class="absolute right-2 top-1/2 -translate-y-1/2 text-xs bg-slate-700 hover:bg-slate-600 text-slate-300 px-2 py-1 rounded border border-slate-600">
                            隨機產生
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-end space-x-3 pt-4 border-t border-slate-800">
                    <button type="button" id="cancel-passcode-btn" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium transition">取消</button>
                    <button type="button" id="save-passcode-btn" class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium transition">套用並同步</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Confirm Delete Modal -->
    <div id="confirm-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm hidden">
        <div class="glass-card w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl text-center">
            <div class="w-12 h-12 rounded-full bg-red-500/10 text-red-400 flex items-center justify-center mx-auto mb-3 border border-red-500/20">
                <i class="fa-solid fa-trash-can text-xl"></i>
            </div>
            <h3 class="text-base font-bold text-slate-200">確定刪除此待辦事項？</h3>
            <p class="text-xs text-slate-400 mt-1">此動作無法復原，並會同步從所有連線裝置中移除。</p>
            <div class="flex items-center justify-center space-x-3 mt-6">
                <button id="cancel-delete-btn" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium transition">取消</button>
                <button id="confirm-delete-btn" class="px-4 py-2 rounded-lg bg-red-600 hover:bg-red-500 text-white text-xs font-medium transition">確定刪除</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 space-y-2 pointer-events-none"></div>

    <!-- Firebase Module JS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration setup
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'taskpulse-todo-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : {
                apiKey: "AIzaSyDemoConfigKeyForTestingOnly",
                authDomain: "demo-project.firebaseapp.com",
                projectId: "demo-project",
                storageBucket: "demo-project.appspot.com",
                messagingSenderId: "123456789",
                appId: "1:123456789:web:abcdef123456"
            };

        // App State
        let app, db, auth;
        let currentUser = null;
        let activePasscode = localStorage.getItem('taskpulse_passcode') || 'demo-sync-room';
        let rawTasks = [];
        let unsubscribeSnapshot = null;
        let pendingDeleteTaskId = null;

        // UI State Filters
        let currentStatusFilter = 'all';
        let currentCategoryFilter = 'all';
        let currentPriorityFilter = 'all';
        let currentSearchQuery = '';
        let currentSort = 'createdAt-desc';

        // DOM elements
        const syncStatusBadge = document.getElementById('sync-status-badge');
        const syncDot = document.getElementById('sync-dot');
        const syncText = document.getElementById('sync-text');
        const passcodeDisplayBtn = document.getElementById('passcode-display-btn');
        const activePasscodeTag = document.getElementById('active-passcode-tag');
        const taskListEl = document.getElementById('task-list');
        const emptyStateEl = document.getElementById('empty-state');

        function showToast(message, type = 'info') {
            const toastContainer = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bgClass = type === 'error' ? 'bg-red-900/90 border-red-500/50 text-red-200' 
                : type === 'success' ? 'bg-emerald-900/90 border-emerald-500/50 text-emerald-200'
                : 'bg-slate-800/90 border-slate-700 text-slate-200';
            
            const iconClass = type === 'error' ? 'fa-circle-exclamation text-red-400' 
                : type === 'success' ? 'fa-circle-check text-emerald-400' 
                : 'fa-circle-info text-blue-400';

            toast.className = `flex items-center space-x-2.5 px-4 py-3 rounded-xl border text-xs shadow-xl backdrop-blur-md transform transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto ${bgClass}`;
            toast.innerHTML = `<i class="fa-solid ${iconClass}"></i><span>${message}</span>`;
            
            toastContainer.appendChild(toast);
            
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function initFirebase() {
            try {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                // Authenticate first (Mandatory Rule 3)
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUser = user;
                        updateSyncStatus('connected', '即時同步中');
                        subscribeToTasks();
                    } else {
                        updateSyncStatus('offline', '未連線');
                    }
                });
            } catch (error) {
                console.error("Firebase init error:", error);
                updateSyncStatus('offline', '離線模式 (展示檔)');
                showToast("無法連接至雲端資料庫，目前處於離線展示模式", "error");
            }
        }

        function subscribeToTasks() {
            if (!currentUser || !db) return;

            // Unsubscribe existing snapshot listener if any
            if (unsubscribeSnapshot) {
                unsubscribeSnapshot();
            }

            updateSyncStatus('syncing', '正在讀取同步資料...');

            // Strict Rule 1: Public data path -> /artifacts/{appId}/public/data/todo_items
            // Strict Rule 2: Simple query (no compound where/orderBy), filter in memory!
            const tasksCollectionRef = collection(db, 'artifacts', appId, 'public', 'data', 'todo_items');

            unsubscribeSnapshot = onSnapshot(tasksCollectionRef, (snapshot) => {
                const items = [];
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    // Filter in memory by active passcode room
                    if (data.passcode === activePasscode) {
                        items.push({ id: docSnap.id, ...data });
                    }
                });

                rawTasks = items;
                renderTasks();
                updateStats();
                updateSyncStatus('connected', '已實時同步');
            }, (error) => {
                console.error("Firestore onSnapshot error:", error);
                updateSyncStatus('offline', '同步連線中斷');
                showToast("無法獲取最新同步資料", "error");
            });
        }

        function updateSyncStatus(status, text) {
            syncText.textContent = text;
            syncDot.className = "w-2.5 h-2.5 rounded-full ";
            if (status === 'connected') {
                syncDot.className += "bg-emerald-500 shadow-sm shadow-emerald-500/50";
            } else if (status === 'syncing') {
                syncDot.className += "bg-yellow-500 animate-pulse";
            } else {
                syncDot.className += "bg-red-500";
            }
        }

        function getFilteredAndSortedTasks() {
            return rawTasks.filter(task => {
                // Status filter
                if (currentStatusFilter === 'active' && task.completed) return false;
                if (currentStatusFilter === 'completed' && !task.completed) return false;

                // Category filter
                if (currentCategoryFilter !== 'all' && task.category !== currentCategoryFilter) return false;

                // Priority filter
                if (currentPriorityFilter !== 'all' && task.priority !== currentPriorityFilter) return false;

                // Search query
                if (currentSearchQuery.trim() !== '') {
                    const q = currentSearchQuery.toLowerCase();
                    const titleMatch = (task.title || '').toLowerCase().includes(q);
                    const notesMatch = (task.notes || '').toLowerCase().includes(q);
                    if (!titleMatch && !notesMatch) return false;
                }

                return true;
            }).sort((a, b) => {
                if (currentSort === 'createdAt-desc') {
                    return (b.createdAt || 0) - (a.createdAt || 0);
                } else if (currentSort === 'dueDate-asc') {
                    if (!a.dueDate) return 1;
                    if (!b.dueDate) return -1;
                    return new Date(a.dueDate) - new Date(b.dueDate);
                } else if (currentSort === 'priority-desc') {
                    const weight = { high: 3, medium: 2, low: 1 };
                    return (weight[b.priority] || 0) - (weight[a.priority] || 0);
                }
                return 0;
            });
        }

        function updateStats() {
            const total = rawTasks.length;
            const completed = rawTasks.filter(t => t.completed).length;
            const active = total - completed;
            const rate = total > 0 ? Math.round((completed / total) * 100) : 0;

            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-active').textContent = active;
            document.getElementById('stat-completed').textContent = completed;
            document.getElementById('stat-rate-text').textContent = `${rate}%`;
            document.getElementById('stat-progress-bar').style.width = `${rate}%`;
        }

        function renderTasks() {
            const tasks = getFilteredAndSortedTasks();
            taskListEl.innerHTML = '';

            if (tasks.length === 0) {
                emptyStateEl.classList.remove('hidden');
                return;
            } else {
                emptyStateEl.classList.add('hidden');
            }

            tasks.forEach(task => {
                const card = document.createElement('div');
                const isOverdue = task.dueDate && !task.completed && new Date(task.dueDate) < new Date();
                
                // Priority badges
                let priorityClass = "bg-slate-800 text-slate-400 border-slate-700";
                let priorityText = "低";
                if (task.priority === 'high') {
                    priorityClass = "bg-red-500/10 text-red-400 border-red-500/30";
                    priorityText = "高優先";
                } else if (task.priority === 'medium') {
                    priorityClass = "bg-amber-500/10 text-amber-400 border-amber-500/30";
                    priorityText = "中優先";
                }

                // Category badge styling
                const categoryColors = {
                    "工作": "bg-blue-500/10 text-blue-400 border-blue-500/30",
                    "個人": "bg-purple-500/10 text-purple-400 border-purple-500/30",
                    "學習": "bg-emerald-500/10 text-emerald-400 border-emerald-500/30",
                    "健康": "bg-rose-500/10 text-rose-400 border-rose-500/30",
                    "財務": "bg-teal-500/10 text-teal-400 border-teal-500/30"
                };
                const categoryClass = categoryColors[task.category] || "bg-slate-800 text-slate-300 border-slate-700";

                // Subtasks calculation
                const subtasks = task.subtasks || [];
                const doneSubtasks = subtasks.filter(s => s.completed).length;

                card.className = `glass-card glass-card-hover rounded-xl p-4 transition-all duration-200 ${task.completed ? 'opacity-65' : ''}`;
                
                card.innerHTML = `
                    <div class="flex items-start justify-between gap-3">
                        <!-- Checkbox & Title Block -->
                        <div class="flex items-start space-x-3 flex-1 min-w-0">
                            <button class="toggle-complete-btn mt-0.5 text-lg transition text-slate-500 hover:text-blue-400" data-id="${task.id}" data-completed="${task.completed}">
                                <i class="${task.completed ? 'fa-solid fa-circle-check text-emerald-400' : 'fa-regular fa-circle'}"></i>
                            </button>
                            <div class="flex-1 min-w-0">
                                <div class="flex flex-wrap items-center gap-2 mb-1">
                                    <h4 class="text-sm font-semibold text-slate-100 ${task.completed ? 'line-through text-slate-400' : ''} truncate">
                                        ${escapeHtml(task.title)}
                                    </h4>
                                    <!-- Badges -->
                                    <span class="px-2 py-0.5 rounded text-[10px] font-medium border ${categoryClass}">${escapeHtml(task.category || '未分類')}</span>
                                    <span class="px-2 py-0.5 rounded text-[10px] font-medium border ${priorityClass}">${priorityText}</span>
                                </div>
                                ${task.notes ? `<p class="text-xs text-slate-400 line-clamp-2 mt-0.5">${escapeHtml(task.notes)}</p>` : ''}
                                
                                <!-- Meta Info (Due date & subtasks) -->
                                <div class="flex flex-wrap items-center gap-3 mt-2.5 text-[11px] text-slate-400">
                                    ${task.dueDate ? `
                                        <span class="flex items-center gap-1 ${isOverdue ? 'text-red-400 font-semibold' : ''}">
                                            <i class="fa-regular fa-clock"></i>
                                            ${formatDueDate(task.dueDate)} ${isOverdue ? '(已逾期)' : ''}
                                        </span>
                                    ` : ''}

                                    ${subtasks.length > 0 ? `
                                        <span class="flex items-center gap-1 text-slate-300">
                                            <i class="fa-solid fa-bars-progress text-blue-400"></i>
                                            子任務 (${doneSubtasks}/${subtasks.length})
                                        </span>
                                    ` : ''}
                                </div>

                                <!-- Subtasks Checklist render -->
                                ${subtasks.length > 0 ? `
                                    <div class="mt-3 pt-2.5 border-t border-slate-800/80 space-y-1.5">
                                        ${subtasks.map((st, idx) => `
                                            <div class="flex items-center space-x-2 text-xs text-slate-300">
                                                <button class="toggle-subtask-btn text-slate-500 hover:text-blue-400" data-task-id="${task.id}" data-sub-idx="${idx}">
                                                    <i class="${st.completed ? 'fa-solid fa-square-check text-emerald-400' : 'fa-regular fa-square'}"></i>
                                                </button>
                                                <span class="${st.completed ? 'line-through text-slate-500' : ''}">${escapeHtml(st.title)}</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                ` : ''}
                            </div>
                        </div>

                        <!-- Task Actions -->
                        <div class="flex items-center space-x-1 shrink-0">
                            <button class="edit-task-btn p-1.5 text-slate-400 hover:text-blue-400 rounded-lg hover:bg-slate-800 transition" data-id="${task.id}">
                                <i class="fa-solid fa-pen-to-square text-xs"></i>
                            </button>
                            <button class="delete-task-btn p-1.5 text-slate-400 hover:text-red-400 rounded-lg hover:bg-slate-800 transition" data-id="${task.id}">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
                taskListEl.appendChild(card);
            });
        }

        async function saveTask(event) {
            event.preventDefault();
            const taskId = document.getElementById('task-id').value;
            const title = document.getElementById('form-title').value.trim();
            const notes = document.getElementById('form-notes').value.trim();
            const category = document.getElementById('form-category').value;
            const priority = document.getElementById('form-priority').value;
            const dueDate = document.getElementById('form-due-date').value;

            // Collect subtasks from inputs
            const subtaskInputs = document.querySelectorAll('.subtask-item-input');
            const subtasks = [];
            subtaskInputs.forEach(input => {
                const val = input.value.trim();
                if (val) {
                    subtasks.push({
                        title: val,
                        completed: input.dataset.completed === 'true'
                    });
                }
            });

            if (!title) return;

            const payload = {
                passcode: activePasscode,
                title,
                notes,
                category,
                priority,
                dueDate: dueDate || null,
                subtasks,
                updatedAt: Date.now()
            };

            try {
                const tasksCollectionRef = collection(db, 'artifacts', appId, 'public', 'data', 'todo_items');
                if (taskId) {
                    // Update
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'todo_items', taskId);
                    await updateDoc(docRef, payload);
                    showToast("已更新待辦事項", "success");
                } else {
                    // Create
                    payload.completed = false;
                    payload.createdAt = Date.now();
                    await addDoc(tasksCollectionRef, payload);
                    showToast("已建立新待辦事項", "success");
                }
                closeTaskModal();
            } catch (err) {
                console.error("Save task error:", err);
                showToast("儲存失敗，請檢查網路連線", "error");
            }
        }

        async function toggleTaskComplete(taskId, currentStatus) {
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'todo_items', taskId);
                await updateDoc(docRef, {
                    completed: !currentStatus,
                    updatedAt: Date.now()
                });
            } catch (err) {
                console.error("Toggle complete error:", err);
                showToast("無法更新狀態", "error");
            }
        }

        async function toggleSubtaskComplete(taskId, subIdx) {
            const task = rawTasks.find(t => t.id === taskId);
            if (!task || !task.subtasks) return;

            const updatedSubtasks = [...task.subtasks];
            updatedSubtasks[subIdx].completed = !updatedSubtasks[subIdx].completed;

            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'todo_items', taskId);
                await updateDoc(docRef, {
                    subtasks: updatedSubtasks,
                    updatedAt: Date.now()
                });
            } catch (err) {
                console.error("Toggle subtask error:", err);
                showToast("無法更新子任務", "error");
            }
        }

        async function executeDeleteTask() {
            if (!pendingDeleteTaskId) return;
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'todo_items', pendingDeleteTaskId);
                await deleteDoc(docRef);
                showToast("已刪除該待辦事項", "success");
            } catch (err) {
                console.error("Delete task error:", err);
                showToast("刪除失敗", "error");
            } finally {
                pendingDeleteTaskId = null;
                closeConfirmModal();
            }
        }

        function applyPasscode(newPasscode) {
            const cleaned = newPasscode.trim().toLowerCase();
            if (!cleaned) {
                showToast("通行碼不能為空", "error");
                return;
            }
            activePasscode = cleaned;
            localStorage.setItem('taskpulse_passcode', cleaned);
            updatePasscodeUI();
            subscribeToTasks();
            closePasscodeModal();
            showToast(`已切換至通行碼同步房: ${cleaned}`, "success");
        }

        function updatePasscodeUI() {
            passcodeDisplayBtn.textContent = `通行碼: ${activePasscode}`;
            activePasscodeTag.textContent = activePasscode;
        }

        function openTaskModal(taskId = null) {
            const modal = document.getElementById('task-modal');
            const form = document.getElementById('task-form');
            const modalTitle = document.getElementById('modal-title');
            const subtaskContainer = document.getElementById('subtask-inputs-container');

            form.reset();
            subtaskContainer.innerHTML = '';

            if (taskId) {
                modalTitle.textContent = "編輯待辦事項";
                const task = rawTasks.find(t => t.id === taskId);
                if (task) {
                    document.getElementById('task-id').value = task.id;
                    document.getElementById('form-title').value = task.title || '';
                    document.getElementById('form-notes').value = task.notes || '';
                    document.getElementById('form-category').value = task.category || '工作';
                    document.getElementById('form-priority').value = task.priority || 'medium';
                    document.getElementById('form-due-date').value = task.dueDate || '';

                    if (task.subtasks && task.subtasks.length > 0) {
                        task.subtasks.forEach(st => addSubtaskInputField(st.title, st.completed));
                    }
                }
            } else {
                modalTitle.textContent = "新增待辦事項";
                document.getElementById('task-id').value = '';
            }

            modal.classList.remove('hidden');
        }

        function closeTaskModal() {
            document.getElementById('task-modal').classList.add('hidden');
        }

        function addSubtaskInputField(initialValue = '', completed = false) {
            const container = document.getElementById('subtask-inputs-container');
            const div = document.createElement('div');
            div.className = "flex items-center space-x-2";
            div.innerHTML = `
                <i class="fa-solid fa-minus text-slate-500 text-xs"></i>
                <input type="text" value="${escapeHtml(initialValue)}" data-completed="${completed}" placeholder="輸入子項目內容..." class="subtask-item-input flex-1 bg-slate-800 border border-slate-700 rounded px-2.5 py-1 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                <button type="button" class="remove-subtask-btn text-slate-500 hover:text-red-400 p-1">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            `;
            div.querySelector('.remove-subtask-btn').addEventListener('click', () => div.remove());
            container.appendChild(div);
        }

        function openPasscodeModal() {
            document.getElementById('passcode-input').value = activePasscode;
            document.getElementById('passcode-modal').classList.remove('hidden');
        }

        function closePasscodeModal() {
            document.getElementById('passcode-modal').classList.add('hidden');
        }

        function openConfirmModal(taskId) {
            pendingDeleteTaskId = taskId;
            document.getElementById('confirm-modal').classList.remove('hidden');
        }

        function closeConfirmModal() {
            document.getElementById('confirm-modal').classList.add('hidden');
            pendingDeleteTaskId = null;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, (m) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            })[m]);
        }

        function formatDueDate(isoString) {
            if (!isoString) return '';
            const d = new Date(isoString);
            return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }

        function generateRandomPasscode() {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let res = '';
            for (let i = 0; i < 6; i++) {
                res += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return `sync-${res}`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Update initial passcode UI
            updatePasscodeUI();

            // Firebase Start
            initFirebase();

            // Task Form Submit
            document.getElementById('task-form').addEventListener('submit', saveTask);

            // Add task button
            document.getElementById('add-task-btn').addEventListener('click', () => openTaskModal());
            document.getElementById('close-modal-btn').addEventListener('click', closeTaskModal);
            document.getElementById('cancel-task-btn').addEventListener('click', closeTaskModal);

            // Subtask Add Input button
            document.getElementById('add-subtask-input-btn').addEventListener('click', () => addSubtaskInputField());

            // Passcode Modal events
            document.getElementById('open-passcode-btn').addEventListener('click', openPasscodeModal);
            document.getElementById('change-passcode-btn').addEventListener('click', openPasscodeModal);
            document.getElementById('close-passcode-modal-btn').addEventListener('click', closePasscodeModal);
            document.getElementById('cancel-passcode-btn').addEventListener('click', closePasscodeModal);
            document.getElementById('save-passcode-btn').addEventListener('click', () => {
                const val = document.getElementById('passcode-input').value;
                applyPasscode(val);
            });
            document.getElementById('generate-random-passcode-btn').addEventListener('click', () => {
                document.getElementById('passcode-input').value = generateRandomPasscode();
            });

            // Copy Passcode Button
            document.getElementById('copy-passcode-btn').addEventListener('click', () => {
                const input = document.createElement('textarea');
                input.value = activePasscode;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                showToast("已複製通行碼至剪貼簿！", "success");
            });

            // Confirm Delete Modal
            document.getElementById('confirm-delete-btn').addEventListener('click', executeDeleteTask);
            document.getElementById('cancel-delete-btn').addEventListener('click', closeConfirmModal);

            // Filters & Search
            document.querySelectorAll('.filter-tab-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-tab-btn').forEach(b => {
                        b.classList.remove('active', 'text-slate-300', 'bg-slate-700/60');
                        b.classList.add('text-slate-400');
                    });
                    e.target.classList.add('active', 'text-slate-300', 'bg-slate-700/60');
                    e.target.classList.remove('text-slate-400');
                    currentStatusFilter = e.target.dataset.status;
                    renderTasks();
                });
            });

            document.getElementById('category-filter').addEventListener('change', (e) => {
                currentCategoryFilter = e.target.value;
                renderTasks();
            });

            document.getElementById('priority-filter').addEventListener('change', (e) => {
                currentPriorityFilter = e.target.value;
                renderTasks();
            });

            document.getElementById('sort-by').addEventListener('change', (e) => {
                currentSort = e.target.value;
                renderTasks();
            });

            document.getElementById('search-input').addEventListener('input', (e) => {
                currentSearchQuery = e.target.value;
                renderTasks();
            });

            // Dynamic Task List Event Delegation (Clicks for checkboxes, delete, edit)
            taskListEl.addEventListener('click', (e) => {
                const completeBtn = e.target.closest('.toggle-complete-btn');
                if (completeBtn) {
                    const id = completeBtn.dataset.id;
                    const completed = completeBtn.dataset.completed === 'true';
                    toggleTaskComplete(id, completed);
                    return;
                }

                const subtaskBtn = e.target.closest('.toggle-subtask-btn');
                if (subtaskBtn) {
                    const taskId = subtaskBtn.dataset.taskId;
                    const subIdx = parseInt(subtaskBtn.dataset.subIdx, 10);
                    toggleSubtaskComplete(taskId, subIdx);
                    return;
                }

                const editBtn = e.target.closest('.edit-task-btn');
                if (editBtn) {
                    openTaskModal(editBtn.dataset.id);
                    return;
                }

                const deleteBtn = e.target.closest('.delete-task-btn');
                if (deleteBtn) {
                    openConfirmModal(deleteBtn.dataset.id);
                    return;
                }
            });
        });
    </script>
</body>
</html>
